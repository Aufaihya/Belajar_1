<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5" style="max-width: 520px">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 fw-bold mb-4">To-Do</h1>

          <div class="input-group mb-4">
            <input
              type="text"
              id="inputTugas"
              class="form-control"
              placeholder="Tugas baru..."
            />
            <button id="tombolTambah" class="btn btn-success">Tambah</button>
          </div>

          <ul id="daftar" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
